import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

// The directories holding the CraftBukkit jars, from ECNMSUTILS_CRAFTBUKKIT_LIBS (File.pathSeparator-separated).
ext.craftBukkitDirs = (System.getenv('ECNMSUTILS_CRAFTBUKKIT_LIBS') ?: '').tokenize(File.pathSeparator)*.trim().findAll()
if (!craftBukkitDirs) {
    throw new GradleException("ECNMSUTILS_CRAFTBUKKIT_LIBS is not set. Set it to the directories holding the CraftBukkit " +
            "jars the README lists (craftbukkit1710 ... craftbukkit1211), separated by '" + File.pathSeparator + "'.")
}

subprojects {
    apply plugin: 'java-library'

    group = 'br.com.finalcraft'
    version = libs.versions.ecnmsutils.get()

    // One JDK compiles and tests every module, and every module emits Java 8 bytecode against the
    // Java 8 API: the same jar has to load on a 1.7.10 server and on a 1.21.1 one. javac 25 reads
    // the newer class files of the 1.21.1 CraftBukkit jar and still emits major 52.
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 8
        options.compilerArgs.addAll(['-parameters', '-Xlint:-options'])
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events = [TestLogEvent.PASSED, TestLogEvent.FAILED, TestLogEvent.SKIPPED]
            exceptionFormat = TestExceptionFormat.FULL
            showExceptions = true
            showCauses = true
            showStackTraces = true
        }
    }

    repositories {
        mavenCentral()
        // EveryLibs resolves from mavenLocal until it is published; filtered so it never shadows
        // another group's resolution.
        mavenLocal {
            content {
                includeGroup 'br.com.finalcraft.everylibs'
            }
        }
        maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots' }
        maven { url = 'https://libraries.minecraft.net/' }
        // The CraftBukkit jars are in no public repository - the README lists the expected names.
        flatDir { dirs rootProject.craftBukkitDirs }
    }
}
