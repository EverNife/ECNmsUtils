plugins {
    alias(libs.plugins.shadow)
    id 'maven-publish'
}

// Packaging only: the published artifact is the shadow jar of the four modules below, and it
// declares no dependency - the consumer brings the server API and everylibs-reflection.
dependencies {
    implementation project(':modules:common')
    implementation project(':modules:pre_v1_20')
    implementation project(':modules:v1_20_1')
    implementation project(':modules:v1_21_1')

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

jar {
    enabled = false
}

shadowJar {
    archiveBaseName.set('ECNmsUtils')
    archiveClassifier.set('')
}

publishing {
    repositories {
        maven {
            name = 'PetrusRepo'
            url = 'https://maven.petrus.dev/public'
            credentials {
                username = System.env.PETRUSMAVEN_ACTOR
                password = System.env.PETRUSMAVEN_TOKEN
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    publications {
        petrus(MavenPublication) {
            artifactId = 'ECNmsUtils'
            from(components.shadow)
            pom {
                url = 'https://petrus.dev'
            }
        }
    }
}
